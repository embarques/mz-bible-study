# Copy to config.toml and fill in your key(s).
# Load order: --config PATH → ./config.toml → beside the binary → ~/.config/lamad/config.toml
# Env overrides: CURSOR_API_KEY, OPENAI_API_KEY, LAMAD_AGENT_PROVIDER

# Backend for prepare / review: "chatgpt" (default) or "cursor" (alias: "openai" for chatgpt)
agent_provider = "chatgpt"

# --- ChatGPT / OpenAI (default) ---
openai_api_key = ""
openai_model = "gpt-4o"
openai_image_model = "gpt-image-1"

# --- Cursor Cloud Agents (optional) ---
# If agent_provider = "cursor", Cursor writes JSON; with openai_api_key set the
# host still generates scenic/definición images in parallel (fast path).
cursor_api_key = ""
cursor_model = "composer-2.5"

audience = "youth"
export_pdf = true

# Bundled poppler — change if you move tools/.
# Relative to the app folder (MZBS_ROOT / next to the lamad binary).
# Windows deploy uses: pdftoppm_path = "tools/pdftoppm.exe"
pdftoppm_path = "tools/pdftoppm"

# Optional overrides:
# scans_dir = "scans"
# output_dir = "bible-studies"
