# Copy to config.toml and fill in your key(s).
# Prefer a project-root config.toml for path settings (see ../config.example.toml).
# Load order: --config PATH → ./config.toml → beside the binary → ~/.config/lamad/config.toml
# Env overrides: CURSOR_API_KEY, OPENAI_API_KEY, LAMAD_AGENT_PROVIDER

# Backend for prepare / review: "cursor" (default) or "chatgpt" (alias: "openai")
agent_provider = "cursor"

# --- Cursor Cloud Agents (default) ---
cursor_api_key = ""
cursor_model = "composer-2.5"
# Adult prepare (section folders) — stronger than Composer; override if needed.
# Must be an id from GET https://api.cursor.com/v1/models (not IDE nicknames).
adult_cursor_model = "claude-opus-5-5"

# --- ChatGPT / OpenAI ---
# Strongly recommended for adult prepare: Cursor writes JSON only; this machine
# generates scenic + definición PNGs via the Images API (parallel with the deck
# build). Without this key, adult still builds using PLACEHOLDER images you can
# replace later (--gen-images or drop PNGs into studies/adult/{N}/images/).
openai_api_key = ""
openai_model = "gpt-4o"
openai_image_model = "gpt-image-1"

audience = "adult"
export_pdf = true

# Bundled poppler — change if you move tools/.
# Relative to the app folder (MZBS_ROOT / next to the lamad binary).
# Windows deploy uses: pdftoppm_path = "tools/pdftoppm.exe"
pdftoppm_path = "tools/pdftoppm"

# --- Data folders (relative to project root, or absolute) ---
# scans_dir = "scans"
# studies_dir = "studies"
# output_dir = "bible-studies"   # writes {audience}/{N}/powerpoint|pdf/
# generated_dir = "generated"
