[package]
name = "lamad"
version = "0.1.0"
edition = "2021"
description = "lamad (Hebrew לָמַד, “to learn / to study”) — Mount Zion Church Bible-study CLI"
license = "MIT"
default-run = "lamad"

[[bin]]
name = "lamad"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.34"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
futures-util = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
